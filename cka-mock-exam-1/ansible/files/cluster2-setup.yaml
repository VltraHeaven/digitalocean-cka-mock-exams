---
apiVersion: v1
kind: Namespace
metadata: {name: prod}
---
apiVersion: v1
kind: Namespace
metadata: {name: ops}
---
apiVersion: v1
kind: Namespace
metadata: {name: payments}
---
apiVersion: v1
kind: Namespace
metadata: {name: inventory}
---
apiVersion: v1
kind: Namespace
metadata: {name: edge}
---
apiVersion: v1
kind: Namespace
metadata: {name: observability}
---
# ==========================================================================
# Task 10 — NetworkPolicy subjects.
# Plain nginx with a rewritten listen directive, so no exotic image tags are
# required and every check returns real HTTP.
# ==========================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-8080
  namespace: payments
data:
  default.conf: |
    server {
      listen 8080;
      location / { return 200 "ledger ok\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels: {app: ledger}
  template:
    metadata:
      labels: {app: ledger}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests: {cpu: 25m, memory: 32Mi}
      volumes:
        - name: conf
          configMap: {name: nginx-8080}
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: payments
spec:
  selector: {app: ledger}
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels: {role: frontend}
  template:
    metadata:
      labels: {role: frontend}
    spec:
      containers:
        - name: shell
          image: busybox:1.36
          command: ["sleep", "36000"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels: {role: scanner}
  template:
    metadata:
      labels: {role: scanner}
    spec:
      containers:
        - name: shell
          image: busybox:1.36
          command: ["sleep", "36000"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
---
# ==========================================================================
# Tasks 11 and 12 — the backend the candidate must expose and route to.
# Note the container port is deliberately UNNAMED: Task 11 requires adding
# the name `http` before a named targetPort can resolve.
# ==========================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-9090
  namespace: inventory
data:
  default.conf: |
    server {
      listen 9090;
      location / { return 200 "stock-api ok\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-api
  namespace: inventory
spec:
  replicas: 3
  selector:
    matchLabels: {app: stock-api}
  template:
    metadata:
      labels: {app: stock-api}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests: {cpu: 25m, memory: 32Mi}
      volumes:
        - name: conf
          configMap: {name: nginx-9090}
---
# ==========================================================================
# Task 13 — a claim with no PV to satisfy it. Stays Pending until the
# candidate creates a matching PersistentVolume.
# ==========================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logs-pvc
  namespace: observability
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-fast
  resources:
    requests:
      storage: 2Gi
