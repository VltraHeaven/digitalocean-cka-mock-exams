---
apiVersion: v1
kind: Namespace
metadata: {name: apps}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-app
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels: {app: legacy}
  template:
    metadata:
      labels: {app: legacy}
    spec:
      containers:
        - name: main-app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do date >> /var/log/app.log; sleep 1; done"]
          volumeMounts:
            - name: log-vol
              mountPath: /var/log
      volumes:
        - name: log-vol
          emptyDir: {}
---
apiVersion: v1
kind: Namespace
metadata: {name: production}
---
apiVersion: v1
kind: Service
metadata:
  name: front-svc
  namespace: production
spec:
  selector: {app: front}
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-app
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels: {app: front}
  template:
    metadata:
      labels: {app: front}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
---
apiVersion: v1
kind: Namespace
metadata: {name: ops}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-worker
  namespace: ops
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "if [ -z \"$DATABASE_URL\" ]; then echo 'Missing DATABASE_URL'; exit 1; fi; sleep 3600"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
