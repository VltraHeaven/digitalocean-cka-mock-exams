---
apiVersion: v1
kind: Namespace
metadata: {name: legacy}
---
apiVersion: v1
kind: Namespace
metadata: {name: restricted}
---
apiVersion: v1
kind: Namespace
metadata: {name: scaling}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-load
  namespace: scaling
spec:
  replicas: 1
  selector:
    matchLabels: {app: cpu-load}
  template:
    metadata:
      labels: {app: cpu-load}
    spec:
      containers:
        - name: stress
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: Namespace
metadata: {name: api}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: api
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: backend
          image: nginx:1.27
          ports:
            - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: api
spec:
  selector: {app: backend}
  ports:
    - port: 80
      targetPort: 8080
