---
# ---------------------------------------------------------------------------
# Kubernetes version
# ---------------------------------------------------------------------------
# The pkgs.k8s.io repository is versioned per minor stream. The playbook
# resolves the exact patch package at runtime so this stays correct as new
# patches ship, instead of pinning a version that may have been superseded.
kube_stream: "1.34"

# Task 3 (node upgrade) needs one node behind the rest. By default the skew is
# at the PATCH level within the same minor stream: it exercises the identical
# `kubeadm upgrade node` procedure with zero risk of a KubeletConfiguration
# schema mismatch. Set kube_skew_stream to "1.33" for a true minor-version
# skew if you want the harder variant.
kube_skew_stream: "1.34"
kube_skew_node: "c1-node-2"

# ---------------------------------------------------------------------------
# Cluster networking
# ---------------------------------------------------------------------------
# 192.168.0.0/16 is Calico's default IPv4 pool, so no manifest edit is needed.
# It must not overlap the DigitalOcean VPC range (10.20.0.0/20).
pod_cidr: "192.168.0.0/16"
service_cidr: "10.96.0.0/12"

# ---------------------------------------------------------------------------
# Addon versions. Empty string = resolve the latest release from the GitHub API.
# Pin these if you need a reproducible lab across rebuilds.
# ---------------------------------------------------------------------------
calico_version: ""          # e.g. "v3.29.1"
metrics_server_version: ""  # e.g. "v0.7.2"
gateway_api_version: ""     # e.g. "v1.2.1"

install_gateway_controller: true
gateway_class_name: "cka-gc"

# ---------------------------------------------------------------------------
# Lab conventions
# ---------------------------------------------------------------------------
exam_answer_dir: /opt/cka
backup_dir: /opt/cka-lab/backups
containerd_cgroup_systemd: true
